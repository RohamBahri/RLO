name: Tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[test]' && pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: bash -n scripts/campaign/onpolicy50_v2.sbatch
      - run: OMP_NUM_THREADS=1 pytest -q
      - run: OMP_NUM_THREADS=1 python -m rlo.train --method a2c --sizes 4 --updates 1 --batch 2 --width 16 --layers 1 --validation-count 2 --out /tmp/rlo-ci
      - run: OMP_NUM_THREADS=1 python -m rlo.study --checkpoint /tmp/rlo-ci/last.pt --sizes 4 --count 2 --k 1 2

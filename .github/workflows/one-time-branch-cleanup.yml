name: One-time merged branch cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only verified merged PR heads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "phase1-research-foundation:1"
            "phase1-reference-audit:2"
            "research-principles-experience-generalization:3"
            "cvpr-rigorous-experiments:4"
            "experiment-compute-accounting:5"
            "fix-group-a-training-review:6"
            "pilot-optional-glimpse:7"
            "add-narval-gpu-group-a:8"
            "evaluation-references-group-a-protocol:9"
            "isolate-reference-python-venv:10"
          )
          for item in "${branches[@]}"; do
            branch="${item%:*}"
            pr="${item#*:}"
            pull="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr")"
            merged="$(jq -r '.merged' <<<"$pull")"
            head_sha="$(jq -r '.head.sha' <<<"$pull")"
            remote_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/$branch" --jq '.commit.sha')"
            if [[ "$merged" != "true" || "$head_sha" != "$remote_sha" ]]; then
              echo "Refusing to delete $branch: PR unmerged or branch changed" >&2
              exit 1
            fi
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            echo "Deleted merged branch $branch"
          done
